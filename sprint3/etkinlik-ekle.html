<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle · Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501088.css">
        <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
           <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <form action="etkinlikler.html" method="get">
      <p>
        <label for="title">Etkinlik Adı</label>
        <input type="text" id="title" name="title" required>
      </p>

      <p>
        <label for="category">Kategori</label>
        <select id="category" name="category" required>
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Yarışma">Yarışma</option>
        </select>
      </p>

      <p>
        <label for="date">Tarih</label>
        <input type="date" id="date" name="date" required>
      </p>

      <p>
        <label for="time">Saat</label>
        <input type="time" id="time" name="time" required>
      </p>

      <p>
        <label for="location">Yer</label>
        <input type="text" id="location" name="location" required>
      </p>

      <p>
        <label for="description">Açıklama</label>
        <textarea id="description" name="description" rows="4" cols="40" required></textarea>
      </p>

      <button type="submit">Kaydet</button>
    </form>
  </main>

  <footer>
    <p>İbrahim Eren Yayla · 2416501088 · 2026</p>
  </footer>
</body>
</html>
